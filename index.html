<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>효기 도구 작업실</title>
<style>
:root{font:16px/1.6 system-ui,sans-serif;color:#e8eef8;background:#0b1220}*{box-sizing:border-box}body{max-width:1280px;margin:auto;padding:32px}header{padding:28px;background:linear-gradient(120deg,#142d4d,#19213d);border-radius:20px}h1{margin:0;font-size:32px}h2{font-size:22px}p{color:#b4c2d9}button,input,select,textarea{font:inherit;border:1px solid #34445d;border-radius:9px;padding:9px;background:#172235;color:inherit}button{cursor:pointer}button:hover{background:#29405b}input,textarea{max-width:100%}.bar{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{padding:20px;border:1px solid #293950;background:#111d2e;border-radius:14px}.card h3{margin:0 0 10px}.chip{display:inline-block;padding:3px 9px;background:#203750;border-radius:20px;font-size:13px;color:#9cdded}a{color:#80d8ef}.muted{font-size:13px;color:#9eafc9}label{display:block}small{display:block}#message{min-height:26px;color:#a1e4c4}.task{padding:12px;margin:10px 0;background:#1b2b40;border-radius:9px;overflow-wrap:anywhere}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.board h3{font-size:16px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}@media(max-width:750px){body{padding:16px}.board{grid-template-columns:1fr 1fr}}@media(max-width:450px){.board{grid-template-columns:1fr}}
</style>
<header><span class="chip">METASONGI · LOCAL WORKSPACE</span><h1>도구는 모았고, 이제 만들 차례.</h1><p>수집한 도구를 기능과 프로젝트에 연결하고, 실행할 작업을 관리하세요.</p><small>기본 목록은 대화 정리본입니다. 가격·라이선스·기능은 실제 도입 전에 원본에서 다시 확인하세요.</small></header>
<div class="bar"><button id="export">내 기록 JSON 내보내기</button><label>기록 가져오기 <input id="import" type="file" accept="application/json"></label></div><div id="message" role="status"></div>
<h2>도구 탐색 <span id="count" class="chip"></span></h2><div class="bar"><input id="query" aria-label="도구 검색" placeholder="이름·기능·프로젝트 검색"><select id="category" aria-label="분류"><option value="">모든 분류</option></select><select id="project" aria-label="적용 프로젝트"><option value="">모든 프로젝트</option></select><label><input type="checkbox" id="selected">선택한 도구만</label></div><main id="catalog" class="grid"></main>
<h2>개발 작업 보드</h2><form id="task-form" class="bar"><input id="title" required maxlength="160" placeholder="완료 조건이 있는 작업" aria-label="작업 제목"><select id="task-project" aria-label="작업 프로젝트"></select><button>작업 추가</button></form><section id="board" class="board"></section>
<h2>데이터 보관</h2><p>선택·메모·작업은 이 브라우저의 localStorage에 저장됩니다. 다른 PC로 옮기거나 브라우저 기록을 지우기 전에 JSON으로 내보내세요. 계정 동기화·실제 AI 에이전트 실행·외부 서비스 자동 가입 기능은 없습니다.</p>
<script src="catalog.js"></script><script src="app.js"></script></html>
